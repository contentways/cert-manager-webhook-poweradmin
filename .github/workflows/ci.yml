name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: 3.x
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - run: go test -coverprofile=coverage.txt -v -race ./...
      - run: go tool cover -func=coverage.txt
      - uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        if: >
          !startsWith(github.head_ref, 'renovate/') &&
          !startsWith(github.head_ref, 'releaser-pleaser--')
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        poweradmin-version:
          - v4.5.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Install PowerDNS and PHP
        run: |
          # keep the packaged pdns service from starting on port 53
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -q
          sudo apt-get install -y -q pdns-server pdns-backend-sqlite3 \
            php-cli php-sqlite3 php-intl php-mbstring php-xml bind9-dnsutils
      - name: Run conformance suite
        run: make test-conformance
        env:
          POWERADMIN_VERSION: ${{ matrix.poweradmin-version }}
      - name: Logs
        if: failure()
        run: tail -n 100 _e2e/*.log

  chart-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Regenerate the parameter table and values schema
        run: make chart-readme
      - name: Fail on drift
        run: git diff --exit-code -- deploy/charts/

  chart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm:
          - v3.22.1
          - v4.3.1
    env:
      CHART: deploy/charts/cert-manager-webhook-poweradmin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - name: Lint
        run: make chart-lint
      - name: Render the test values and validate them
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for f in "$CHART"/ci/*.yaml "$CHART"/tests/values/*.yaml; do
            echo "== $f"
            helm template test "$CHART" -f "$f" | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - name: Build the image and load it into kind
        run: |
          make image TAG=ci
          kind load docker-image ghcr.io/contentways/cert-manager-webhook-poweradmin:ci --name chart-testing
      # the webhook needs cert-manager's CRDs and cainjector
      - name: Install cert-manager
        run: |
          helm install cert-manager oci://quay.io/jetstack/charts/cert-manager --version v1.21.2 \
            --namespace cert-manager --create-namespace --set crds.enabled=true --wait
      - name: Install the chart
        run: |
          helm install webhook "$CHART" --namespace cert-manager \
            --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 5m
          kubectl wait --for=condition=Available apiservice/v1alpha1.acme.contentways.org --timeout=120s
      - name: Logs
        if: failure()
        run: kubectl -n cert-manager logs deploy/webhook-cert-manager-webhook-poweradmin --tail=100 || true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
