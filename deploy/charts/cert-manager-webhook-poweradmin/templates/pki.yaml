{{- /* A self-signed CA issues the serving certificate of the webhook's API server. */}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "cmwp.selfSignedIssuer" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: webhook
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "cmwp.caCertificate" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: webhook
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ include "cmwp.caCertificate" . }}
  duration: {{ .Values.pki.caDuration }}
  commonName: {{ printf "ca.%s.cert-manager" (include "common.names.fullname" .) | trunc 64 | quote }}
  isCA: true
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "cmwp.selfSignedIssuer" . }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "cmwp.caIssuer" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: webhook
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  ca:
    secretName: {{ include "cmwp.caCertificate" . }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "cmwp.servingCertificate" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: webhook
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ include "cmwp.servingCertificate" . }}
  duration: {{ .Values.pki.servingCertificateDuration }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "cmwp.caIssuer" . }}
  {{- $fullname := include "common.names.fullname" . }}
  {{- $namespace := include "common.names.namespace" . }}
  dnsNames:
    - {{ $fullname }}
    - {{ printf "%s.%s" $fullname $namespace }}
    - {{ printf "%s.%s.svc" $fullname $namespace }}
