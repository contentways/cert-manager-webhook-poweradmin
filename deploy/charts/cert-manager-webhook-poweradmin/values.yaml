## @section Global parameters
## Global values apply to this chart and every subchart that reads them.

## @param global.imageRegistry Global container image registry
## @param global.imagePullSecrets Global registry secret names as an array
##
global:
  imageRegistry: ""
  ## e.g.
  ## imagePullSecrets:
  ##   - my-registry-secret
  ##
  imagePullSecrets: []
  ## Adjustments for specific Kubernetes distributions
  ##
  compatibility:
    ## Adjustments for OpenShift
    ##
    openshift:
      ## @param global.compatibility.openshift.adaptSecurityContext Drop fixed runAsUser, runAsGroup and fsGroup so the restricted SCC can assign its own (auto: only on OpenShift, force, disabled)
      ##
      adaptSecurityContext: auto

## @section Common parameters

## @param kubeVersion Override the Kubernetes version detected from the cluster
##
kubeVersion: ""
## @param apiVersions Override the API versions detected from the cluster (used by helm template)
##
apiVersions: []
## @param nameOverride Replaces the chart name in the object names
##
nameOverride: ""
## @param fullnameOverride Replaces the generated base name of all objects
##
fullnameOverride: ""
## @param namespaceOverride Namespace for all objects instead of the release namespace
##
namespaceOverride: ""
## @param commonLabels Labels set on every object of the release
##
commonLabels: {}
## @param commonAnnotations Annotations set on every object of the release
##
commonAnnotations: {}
## @param extraDeploy Additional manifests installed with the release; may contain templates
##
extraDeploy: []

## @section Webhook parameters

## @param groupName API group of the webhook; issuers reference it as solvers[].dns01.webhook.groupName
##
groupName: acme.contentways.org
## cert-manager installation that calls the webhook
## @param certManager.namespace Namespace of cert-manager
## @param certManager.serviceAccountName ServiceAccount of the cert-manager controller
##
certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager
## Read access to the Secrets with the Poweradmin API keys. They live in the namespace of each Issuer,
## or in the cluster resource namespace of cert-manager for ClusterIssuers.
## @param secretAccess.namespaces Namespaces whose Secrets the webhook may read; empty grants access in all namespaces
## @param secretAccess.resourceNames Names of the Secrets the webhook may read; empty allows every Secret in those namespaces
##
secretAccess:
  namespaces: []
  resourceNames: []
## Certificates of the webhook's API server, issued by cert-manager from a chart-managed CA
## @param pki.caDuration Lifetime of the CA certificate
## @param pki.servingCertificateDuration Lifetime of the serving certificate
##
pki:
  caDuration: 43800h
  servingCertificateDuration: 8760h
## @param logLevel klog verbosity of the webhook; presented and cleaned up records are logged at every level
##
logLevel: 2

## @section Image parameters

## Webhook image
## ref: https://github.com/contentways/cert-manager-webhook-poweradmin/pkgs/container/cert-manager-webhook-poweradmin
## @param image.registry [default: ghcr.io] Webhook image registry
## @param image.repository [default: contentways/cert-manager-webhook-poweradmin] Webhook image repository
## @skip image.tag Webhook image tag (defaults to the chart appVersion)
## @param image.digest Webhook image digest in the form sha256:aa.... Wins over the tag
## @param image.pullPolicy Webhook image pull policy
## @param image.pullSecrets Webhook image pull secrets
##
image:
  registry: ghcr.io
  repository: contentways/cert-manager-webhook-poweradmin
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  ## e.g.
  ## pullSecrets:
  ##   - my-registry-secret
  ##
  pullSecrets: []

## @section Deployment parameters

## @param replicaCount Number of webhook replicas
##
replicaCount: 1
## @param revisionHistoryLimit Number of old ReplicaSets to retain
##
revisionHistoryLimit: 10
## @param updateStrategy.type Deployment strategy type
##
updateStrategy:
  type: RollingUpdate
## @param containerPorts.https HTTPS port of the webhook's API server
##
containerPorts:
  https: 8443
## @param command Override the default container command
##
command: []
## @param args Override the default container args
##
args: []
## @param extraArgs Extra arguments for the webhook, e.g. --tls-min-version=VersionTLS13
##
extraArgs: []
## @param extraEnvVars Extra environment variables for the webhook container
##
extraEnvVars: []
## @param extraEnvVarsCM Name of a ConfigMap whose keys become environment variables
##
extraEnvVarsCM: ""
## @param extraEnvVarsSecret Name of a Secret whose keys become environment variables
##
extraEnvVarsSecret: ""
## Pod security context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
## @param podSecurityContext.enabled Enable the pod security context
## @param podSecurityContext.fsGroupChangePolicy When to change volume ownership
## @param podSecurityContext.sysctls Kernel settings via sysctl
## @param podSecurityContext.supplementalGroups Additional groups for the first process
## @param podSecurityContext.fsGroup Group owning the volumes
## @param podSecurityContext.seccompProfile.type Seccomp profile
##
podSecurityContext:
  enabled: true
  fsGroupChangePolicy: Always
  sysctls: []
  supplementalGroups: []
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
## Container security context. The distroless image runs as the nonroot user (65532).
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
## @param containerSecurityContext.enabled Enable the container security context
## @param containerSecurityContext.seLinuxOptions SELinux options
## @param containerSecurityContext.runAsUser User ID
## @param containerSecurityContext.runAsGroup Group ID
## @param containerSecurityContext.runAsNonRoot Require a non-root user
## @param containerSecurityContext.privileged Run privileged
## @param containerSecurityContext.readOnlyRootFilesystem Mount the root filesystem read-only
## @param containerSecurityContext.allowPrivilegeEscalation Allow privilege escalation
## @param containerSecurityContext.capabilities.drop Capabilities to drop
## @param containerSecurityContext.seccompProfile.type Seccomp profile
##
containerSecurityContext:
  enabled: true
  seLinuxOptions: {}
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
## @param resourcesPreset Resources preset (none, nano, micro, small, medium, large, xlarge, 2xlarge); ignored when resources is set
##
resourcesPreset: nano
## @param resources Container requests and limits, e.g. requests.cpu: 50m, limits.memory: 128Mi
##
resources: {}
## Liveness probe against /healthz
## @param livenessProbe.enabled Run a liveness probe
## @param livenessProbe.initialDelaySeconds Seconds after container start before the first liveness check
## @param livenessProbe.periodSeconds Seconds between liveness checks
## @param livenessProbe.timeoutSeconds Seconds after which a liveness check times out
## @param livenessProbe.failureThreshold Failed liveness checks in a row before the probe fails
## @param livenessProbe.successThreshold Successful liveness checks in a row before the probe passes again
##
livenessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
## Readiness probe against /healthz
## @param readinessProbe.enabled Run a readiness probe
## @param readinessProbe.initialDelaySeconds Seconds after container start before the first readiness check
## @param readinessProbe.periodSeconds Seconds between readiness checks
## @param readinessProbe.timeoutSeconds Seconds after which a readiness check times out
## @param readinessProbe.failureThreshold Failed readiness checks in a row before the probe fails
## @param readinessProbe.successThreshold Successful readiness checks in a row before the probe passes again
##
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
## @param customLivenessProbe Complete liveness probe that replaces the built-in one
##
customLivenessProbe: {}
## @param customReadinessProbe Complete readiness probe that replaces the built-in one
##
customReadinessProbe: {}
## @param lifecycleHooks Lifecycle hooks for the webhook container
##
lifecycleHooks: {}
## @param automountServiceAccountToken Mount the service account token in the pod (the webhook needs it to read Secrets)
##
automountServiceAccountToken: true
## @param hostAliases Webhook pod host aliases
## ref: https://kubernetes.io/docs/concepts/services-networking/add-entries-to-pod-etc-hosts-with-host-aliases/
##
hostAliases: []
## @param podLabels Extra labels for webhook pods
##
podLabels: {}
## @param podAnnotations Annotations for webhook pods
##
podAnnotations: {}
## @param podAffinityPreset Pod affinity preset (soft or hard). Ignored if affinity is set
##
podAffinityPreset: ""
## @param podAntiAffinityPreset Pod anti-affinity preset (soft or hard). Ignored if affinity is set
##
podAntiAffinityPreset: soft
## Node affinity preset
## @param nodeAffinityPreset.type Node affinity preset type (soft or hard). Ignored if affinity is set
## @param nodeAffinityPreset.key Node label key to match
## @param nodeAffinityPreset.values Node label values to match
##
nodeAffinityPreset:
  type: ""
  key: ""
  values: []
## @param affinity Affinity for webhook pods (evaluated as a template)
##
affinity: {}
## @param nodeSelector Node labels for webhook pods (evaluated as a template)
##
nodeSelector: {}
## @param tolerations Tolerations for webhook pods (evaluated as a template)
##
tolerations: []
## @param topologySpreadConstraints Topology spread constraints for webhook pods (evaluated as a template)
##
topologySpreadConstraints: []
## @param priorityClassName Webhook pods' priorityClassName
##
priorityClassName: ""
## @param schedulerName Scheduler for the pods; empty means the default scheduler
##
schedulerName: ""
## @param terminationGracePeriodSeconds Seconds webhook pods need to terminate gracefully
##
terminationGracePeriodSeconds: ""
## @param extraVolumes Optionally specify extra list of additional volumes for the webhook pods
##
extraVolumes: []
## @param extraVolumeMounts Optionally specify extra list of additional volumeMounts for the webhook container
##
extraVolumeMounts: []
## @param sidecars Add additional sidecar containers to the webhook pods
##
sidecars: []
## @param initContainers Add additional init containers to the webhook pods
##
initContainers: []

## Pod disruption budget
## @param pdb.create Create a PodDisruptionBudget
## @param pdb.minAvailable Pods (number or percentage) that must stay available during voluntary disruptions
## @param pdb.maxUnavailable Maximum number/percentage of unavailable pods; defaults to 1 when both are empty
##
pdb:
  create: true
  minAvailable: ""
  maxUnavailable: ""

## @section Service parameters

service:
  ## @param service.type Type of the Service
  ##
  type: ClusterIP
  ## @param service.ports.https HTTPS port of the Service
  ##
  ports:
    https: 443
  ## @param service.clusterIP Service Cluster IP
  ##
  clusterIP: ""
  ## @param service.annotations Additional custom annotations for the Service
  ##
  annotations: {}
  ## @param service.ipFamilyPolicy IP family policy of the Service
  ##
  ipFamilyPolicy: ""
  ## @param service.ipFamilies IP families of the Service
  ##
  ipFamilies: []

## @section Other parameters

serviceAccount:
  ## @param serviceAccount.create Create a ServiceAccount
  ##
  create: true
  ## @param serviceAccount.name Name of the ServiceAccount; generated from the fullname when empty
  ##
  name: ""
  ## @param serviceAccount.automountServiceAccountToken Automount the token of the created ServiceAccount
  ##
  automountServiceAccountToken: false
  ## @param serviceAccount.annotations Annotations for the ServiceAccount
  ##
  annotations: {}
